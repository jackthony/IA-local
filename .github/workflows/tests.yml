name: tests

on:
  push:
    branches: [main]
  pull_request:

# Zero trust: permisos mínimos y Actions fijadas por SHA de commit (no por tag mutable).
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04  # fijado: ubuntu-latest migra de versión sin aviso en el código
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Dependencias exactas del lock (hashes)
        # --extra prod = el conjunto de la imagen de producción; los escenarios del router comprueban la telemetría con su SDK
        run: uv sync --locked --extra prod
      - name: Escáner de secretos
        run: uv run python scripts/escanear_secretos.py
      - name: Tests deterministas (sin LLM)
        run: |
          for t in scripts/test_escanear_secretos.py scripts/test_repo.py scripts/test_inventario.py labs/test_divisas.py labs/test_orquestacion.py \
                   labs/test_mcp.py labs/test_router.py labs/test_hitl.py labs/test_escenarios_hitl.py evals/test_evals.py \
                   jev/test_jev.py jev/test_datos.py jev/test_empresa.py servicios/test_servicios.py servicios/test_escenarios.py; do
            echo "== $t"
            uv run python "$t"
          done
      - name: Puerta de evaluación (golden set, sin LLM)
        # Falla si algún umbral de evals/umbrales.json se pasa. El reporte JSON queda en evals/reportes/ y se vuelca al log.
        run: |
          status=0
          uv run python evals/evaluar.py || status=$?
          for r in evals/reportes/*.json; do cat "$r"; done
          exit $status
      - name: Auditoría de dependencias contra OSV
        run: uv run python jev/auditar_deps.py
